# Copy to wup.toml and configure only the capabilities you use. Never put secrets here.
[tools]
# Empty means all built-in checks. Otherwise list names such as "Node.js" or "Git".
enabled = []

[local]
# Empty uses the platform default (for Windows: %LOCALAPPDATA%\\WUP).
state_dir = ""

[notifications.telegram]
# Telegram credentials are read from TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
enabled = false
# Optional local file containing only TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
# Keep it outside this repository and leave empty when process environment is used.
env_file = ""

[notifications.email]
# Optional command whose executable accepts: send --subject TEXT --text TEXT --html TEXT
# command = "node C:\\path\\to\\cloudflare-email-cli.js"
command = ""

[remote]
# Required only for publishing the sanitized local snapshot to a private GitHub Actions secret.
repository = ""
state_branch = "toolchain-remote-state"
publish_snapshot = false
