# Copy to wup.toml and configure only the capabilities you use. Never put secrets here.
[tools]
# Empty means all built-in checks. Otherwise list names such as "Node.js" or "Git".
enabled = []

[local]
# Empty uses the platform default (for Windows: %LOCALAPPDATA%\\WUP).
state_dir = ""
# Optional local Workstation Ops/MCP repository for its audit check. Leave empty when unavailable.
workstation_ops_path = ""

# Legacy [notifications] and [remote] sections are ignored. Remove them if present.
